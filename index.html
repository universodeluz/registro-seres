<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1230">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Registro de Seres de Luz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:wght@400;600&display=swap">
<style>
:root{--bg:#0c1230;--bg2:#141b45;--panel:#1a2252;--line:#2c3772;--oro:#d9b45a;--azul:#7fb0ff;--txt:#ece9f6;--mut:#9aa3cf;--rojo:#ff8d8d;
 --serif:'Crimson Pro',Georgia,serif;--tit:'Cinzel',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--serif);font-size:18px;line-height:1.5}
body{min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);background:radial-gradient(120% 60% at 50% 0,var(--bg2),var(--bg) 70%) fixed}
#app{max-width:640px;margin:0 auto;padding:0 16px 96px}
h1,h2,h3{font-family:var(--tit);font-weight:700;margin:0;color:var(--oro);letter-spacing:.02em}
input,select,textarea,button{font:inherit;font-size:16px;color:var(--txt)}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:4px}
input[type=checkbox]{width:24px;height:24px;margin:8px 0 0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
.btn,.ghost{min-height:46px;border-radius:10px;border:1px solid var(--oro);padding:0 18px;cursor:pointer}
.btn{background:var(--oro);color:#241b05;font-weight:600}
.ghost{background:transparent;color:var(--oro)}
.login{padding-top:18vh;display:grid;gap:12px;text-align:center}
.login h1{font-size:30px;line-height:1.2;margin-bottom:14px}
.err{color:var(--rojo);min-height:1.5em;margin:0}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0 10px}
header h2{font-size:22px}
.tools{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.tools input{grid-column:1/-1;margin:0}.tools select{margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--oro);border-radius:6px 14px 14px 6px;padding:12px 14px;margin-top:10px;cursor:pointer}
.card b{font-family:var(--tit);color:var(--oro);font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:14px;color:var(--azul);border:1px solid var(--line);border-radius:20px;padding:1px 10px}
.mut{color:var(--mut)}
.chip.osc{color:var(--rojo);border-color:#6b3a4a}.chip.luz{color:var(--oro)}
.link{cursor:pointer}.peligro{border-color:var(--rojo);color:var(--rojo)}
.btn:disabled,.ghost:disabled{opacity:.4}
.fil{display:flex;justify-content:space-between;align-items:center;gap:10px}.fil.sel{border-left:3px solid var(--oro);padding-left:8px}
.grp{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}.grp summary{cursor:pointer;list-style:none}.grp summary::-webkit-details-marker{display:none}.grp summary .mut{display:block;font-size:15px}
header{flex-wrap:wrap;gap:8px}header h2{font-size:20px}header .ghost{padding:0 12px;font-size:15px;min-height:40px}
#mapa{height:58vh;border-radius:12px;border:1px solid var(--line);margin-top:10px}
.leaflet-container{background:#0c1230;font-family:var(--serif)}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.7)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg2);color:var(--txt)}.sub{color:var(--azul);font-size:16px;margin:14px 0 2px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0));width:58px;height:58px;border-radius:50%;border:0;background:var(--oro);color:#241b05;font-size:32px;line-height:1;box-shadow:0 6px 18px #0008;cursor:pointer}
.sec{margin-top:22px}.sec h3{font-size:16px;margin-bottom:6px}
.item{border-top:1px solid var(--line);padding:10px 0}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.priv{border:1px dashed var(--oro);border-radius:10px;padding:10px 12px;margin-top:14px}
#sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:5}
#sheet[hidden]{display:none}
.hoja{background:var(--bg2);width:100%;max-width:640px;margin:0 auto;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0))}
.hoja label{display:block;margin-top:12px;color:var(--mut);font-size:16px}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<div id="app"></div>
<div id="sheet" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
// ====== PEGA AQUÍ TUS DATOS DE SUPABASE (Project Settings > API) ======
const SUPABASE_URL = 'https://hhnmkaodpequxqkhuitz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_u2ycDvACsEddFbUIfha-_A_J0L45eaX';   // nunca uses la service_role
// ======================================================================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let rol = null, niveles = [], funciones = [], coros = [], seres = [], filtro = {q:'', tipo:'', coro:'', nat:'', fg:'', vc:'', nv:''};

const TIPOS = [['persona_real','Persona real'],['libro','Ser de los libros']];
const ENC = [['','Sin definir'],['encarnado','Encarnado'],['no_encarnado','No encarnado']];
const VINC = ['MariaM','Ariel','En conjunto','En común'];
const NAT = [['sin_definir','Sin definir'],['luz','Luz'],['oscuridad','Oscuridad']];
const LADOS = [['paterno','Linaje paterno'],['materno','Linaje materno'],['directo','Línea directa (hermanos, hijos, sobrinos)']];
const REL = ['bisabuelo','bisabuela','abuelo','abuela','padre','madre','tío','tía','hermano','hermana','pareja','hijo','hija','sobrino','sobrina','primo','prima','nieto','nieta','bisnieto','bisnieta','otro'].map(r => [r, r[0].toUpperCase() + r.slice(1)]);
const GRADOS = [['','Sin grado']].concat([1,2,3,4,5,6,7,8,9].map(n => [String(n), 'D-' + n]));
const raizDe = s => seres.find(x => x.id === s.raiz_id) || s;
const grupoNombre = r => r.grupo ? r.grupo + ' (' + r.codigo + ')' : 'Familia ' + r.codigo;
const natChip = (n, g) => n === 'luz' ? '<span class="chip luz">Luz</span>' : n === 'oscuridad' ? '<span class="chip osc">Oscuridad' + (g ? ' D-' + g : '') + '</span>' : '';
const relTxt = v => { const r = (REL.find(x => x[0] === v.relacion) || ['',''])[1].toLowerCase();
  return r + (v.lado && v.lado !== 'directo' && v.relacion !== 'padre' && v.relacion !== 'madre' ? ' ' + v.lado : ''); };

async function init(){
  const {data:{session}} = await sb.auth.getSession();
  session ? entrar() : login();
}

function login(msg=''){
  $('#app').innerHTML = `<div class="login"><h1>Registro de<br>Seres de Luz</h1>
    <input id="em" type="email" placeholder="Correo" autocomplete="username">
    <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn" id="go">Entrar</button><p class="err">${esc(msg)}</p></div>`;
  $('#go').onclick = async () => {
    const {error} = await sb.auth.signInWithPassword({email:$('#em').value.trim(), password:$('#pw').value});
    error ? login('Correo o contraseña incorrectos.') : entrar();
  };
}

async function entrar(){
  const {data:{user}} = await sb.auth.getUser();
  const {data:p} = await sb.from('perfiles').select('rol').eq('id', user.id).maybeSingle();
  if(!p){ await sb.auth.signOut(); return login('Tu cuenta aún no tiene permisos. Avisa al administrador.'); }
  rol = p.rol;
  const {data:c} = await sb.from('coros_angelicos').select('*').order('id');
  coros = c || [];
  const {data:fg} = await sb.from('funciones_gaia').select('*').order('id');
  funciones = fg || [];
  const {data:nd} = await sb.from('niveles_despertar').select('*').order('id');
  niveles = nd || [];
  await cargar(); lista();
}

async function cargar(){
  const {data,error} = await sb.from('seres').select('*,coros_angelicos(nombre),funciones_gaia(nombre),niveles_despertar(nombre)').order('codigo');
  if(error) alert('No se pudieron cargar las fichas: ' + error.message);
  seres = data || [];
}

function siguienteCodigo(){
  const n = seres.map(s => parseInt((s.codigo||'').replace(/\D/g,''),10)).filter(Number.isFinite);
  return 'SL-' + String((n.length ? Math.max(...n) : 0) + 1).padStart(4,'0');
}

function resumenHtml(){
  const luz = seres.filter(s => s.naturaleza === 'luz');
  const fila = (k, v, txt, n) => `<div class="item link fil${filtro[k] === String(v) ? ' sel' : ''}" data-k="${k}" data-v="${esc(v)}"><span>${esc(txt)}</span><span class="chip luz">${n}</span></div>`;
  return `<details class="grp"><summary><b>Niveles de despertar</b><span class="mut">Seres de luz por nivel. Toca uno para filtrar.</span></summary>
    ${niveles.map(n => fila('nv', n.id, n.nombre, luz.filter(s => s.nivel_despertar_id === n.id).length)).join('') || '<p class="mut">Sin niveles cargados.</p>'}</details>
    <details class="grp"><summary><b>Funciones en la ascensión de Gaia</b><span class="mut">Seres de luz por función. Toca una para filtrar.</span></summary>
    ${funciones.map(f => fila('fg', f.id, f.nombre, luz.filter(s => s.funcion_gaia_id === f.id).length)).join('') || '<p class="mut">Sin funciones cargadas.</p>'}</details>
    <details class="grp"><summary><b>Vinculado a</b><span class="mut">Seres de luz por vínculo. Toca uno para filtrar.</span></summary>
    ${VINC.map(v => fila('vc', v, v, luz.filter(s => s.vinculado_a === v).length)).join('')}</details>`;
}

function lista(){
  $('#app').innerHTML = `<header><h2>Seres de Luz</h2><div class="row" style="margin:0"><button class="ghost" id="mapb">Mapa</button>${rol==='administrador'?'<button class="ghost" id="nom">Nombres</button>':''}<button class="ghost" id="out">Salir</button></div></header>
    <div class="tools"><input id="q" type="search" placeholder="Buscar por código, nombre angelical o raza" value="${esc(filtro.q)}">
    <select id="ft"><option value="">Todos los tipos</option>${TIPOS.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join('')}</select>
    <select id="fc"><option value="">Todos los coros</option>${coros.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}</select>
    <select id="fn" style="grid-column:1/-1;margin:0"><option value="">Luz y oscuridad</option><option value="luz">Luz</option><option value="oscuridad">Oscuridad</option></select></div>
    ${resumenHtml()}<div id="cards"></div><button class="fab" id="nuevo" aria-label="Nueva ficha">+</button>`;
  $('#ft').value = filtro.tipo; $('#fc').value = filtro.coro; $('#fn').value = filtro.nat;
  $('#q').oninput = e => { filtro.q = e.target.value; pinta(); };
  $('#ft').onchange = e => { filtro.tipo = e.target.value; pinta(); };
  $('#fc').onchange = e => { filtro.coro = e.target.value; pinta(); };
  $('#fn').onchange = e => { filtro.nat = e.target.value; pinta(); };
  $('#out').onclick = async () => { await sb.auth.signOut(); login(); };
  if($('#nom')) $('#nom').onclick = nombres;
  $('#mapb').onclick = verMapa;
  $('#nuevo').onclick = () => fichaForm(null, null);
  document.querySelectorAll('.fil').forEach(e => e.onclick = () => {
    const k = e.dataset.k, v = e.dataset.v;
    filtro[k] = filtro[k] === v ? '' : v;
    if(filtro[k]){ filtro.nat = 'luz'; $('#fn').value = 'luz'; }
    document.querySelectorAll('.fil[data-k="' + k + '"]').forEach(x => x.classList.toggle('sel', x.dataset.v === filtro[k]));
    pinta();
  });
  pinta();
}

function mapaBase(m){ L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, attribution:'© OpenStreetMap'}).addTo(m); }

async function lugarDe(lat, lng){
  try{
    const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&accept-language=es&lat=' + lat + '&lon=' + lng);
    const a = (await r.json()).address || {};
    return {pais:a.country || '', estado_region:a.state || a.region || '', ciudad:a.city || a.town || a.village || a.county || ''};
  }catch(e){ return {}; }
}

// Leer coordenadas pegadas desde Google Maps (coordenadas sueltas o enlace completo)
function leerCoord(t){
  t = (t || '').trim();
  try{ t = decodeURIComponent(t); }catch(e){}
  const m = t.match(/@(-?\d+\.?\d*),\s*(-?\d+\.?\d*)/) || t.match(/!3d(-?\d+\.?\d*)!4d(-?\d+\.?\d*)/) ||
    t.match(/[?&](?:q|ll|query|center)=(-?\d+\.?\d*),\s*(-?\d+\.?\d*)/) || t.match(/^\s*(-?\d+\.?\d*)\s*[,;\s]\s*(-?\d+\.?\d*)\s*$/);
  if(!m) return null;
  const la = +m[1], ln = +m[2];
  return (Math.abs(la) <= 90 && Math.abs(ln) <= 180) ? [la, ln] : null;
}

// Elegir un punto: tocando el mapa, buscando un lugar o pegando coordenadas de Google Maps
function elegirPunto(cb){
  const h = $('#sheet'); h.hidden = false;
  h.innerHTML = `<div class="hoja" style="height:94vh;display:flex;flex-direction:column"><h3>Ubicación</h3>
    <div style="display:flex;gap:8px;margin-top:8px"><input id="qlug" placeholder="Buscar lugar (ciudad, estado o país)" style="margin:0"><button type="button" class="ghost" id="blug">Buscar</button></div>
    <div style="display:flex;gap:8px;margin-top:8px"><input id="qgm" placeholder="Pegar coordenadas o enlace de Google Maps" style="margin:0"><button type="button" class="ghost" id="bgm">Usar</button></div>
    <div style="display:flex;gap:8px;margin-top:8px"><button type="button" class="ghost" id="bgo">Abrir Google Maps</button>
      <select id="prec" style="margin:0"><option value="aprox">Aproximada (10 km)</option><option value="exacta">Exacta</option></select></div>
    <p class="mut" id="pinfo" style="margin:6px 0">Toca el mapa para marcar el punto.</p>
    <div id="pmap" style="flex:1;min-height:240px;border-radius:12px;border:1px solid var(--line)"></div>
    <div class="row"><button type="button" class="ghost" id="pcx">Cancelar</button><button type="button" class="ghost" id="pom">Sin mapa</button><button type="button" class="btn" id="pok" disabled>Usar este punto</button></div></div>`;
  const m = L.map('pmap').setView([7.5,-66], 5); mapaBase(m);
  setTimeout(() => m.invalidateSize(), 150);
  let mk = null, ex = null, pt = null;
  const info = () => {
    if(!ex) return;
    const exacta = $('#prec').value === 'exacta';
    pt = exacta ? [+ex[0].toFixed(4), +ex[1].toFixed(4)] : [Math.round(ex[0] * 10) / 10, Math.round(ex[1] * 10) / 10];
    $('#pinfo').textContent = 'Se guardará: ' + pt[0] + ', ' + pt[1] + (exacta ? ' (exacta)' : ' (aproximada, unos 10 km)');
  };
  const poner = (la, ln, centrar) => {
    ex = [la, ln];
    if(mk) mk.setLatLng(ex); else mk = L.circleMarker(ex, {radius:10, color:'#d9b45a', fillColor:'#d9b45a', fillOpacity:.7}).addTo(m);
    if(centrar) m.setView(ex, Math.max(m.getZoom(), 12));
    $('#pok').disabled = false; info();
  };
  m.on('click', e => poner(e.latlng.lat, e.latlng.lng, false));
  $('#prec').onchange = info;
  $('#blug').onclick = async () => {
    const q = $('#qlug').value.trim(); if(!q) return;
    try{
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=es&q=' + encodeURIComponent(q));
      const j = await r.json();
      j[0] ? m.setView([+j[0].lat, +j[0].lon], 12) : alert('No se encontró ese lugar.');
    }catch(e){ alert('No se pudo buscar el lugar.'); }
  };
  $('#bgm').onclick = () => {
    const t = $('#qgm').value, c = leerCoord(t);
    if(c) return poner(c[0], c[1], true);
    alert(/goo\.gl|maps\.app/i.test(t) ? 'Ese enlace corto no trae las coordenadas. Ábrelo en Google Maps, mantén el dedo sobre el punto, toca las coordenadas para copiarlas y pégalas aquí.' : 'No se reconocieron coordenadas. Pega algo como 7.7669, -72.2250 o un enlace largo de Google Maps.');
  };
  $('#bgo').onclick = () => {
    const q = $('#qlug').value.trim(), c = m.getCenter();
    window.open(q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q)
                  : 'https://www.google.com/maps/@' + c.lat.toFixed(5) + ',' + c.lng.toFixed(5) + ',' + m.getZoom() + 'z', '_blank');
  };
  $('#pcx').onclick = () => { m.remove(); cerrar(); };
  $('#pom').onclick = () => { m.remove(); cerrar(); cb(null); };
  $('#pok').onclick = () => { m.remove(); cerrar(); cb(pt); };
}

async function verMapa(){
  const {data,error} = await sb.from('ubicaciones').select('*').not('lat','is',null);
  if(error) return alert('No se pudo cargar el mapa: ' + error.message);
  const pts = (data || []).map(u => ({u, s: seres.find(x => x.id === u.ser_id)})).filter(x => x.s);
  const grupos = [...new Map(pts.map(x => { const r = raizDe(x.s); return [r.id, grupoNombre(r)]; })).entries()].sort((a,b) => a[1].localeCompare(b[1]));
  $('#app').innerHTML = `<header><button class="ghost" id="atras">Volver</button><h2>Mapa</h2></header>
    <div class="tools"><select id="mn"><option value="">Luz y oscuridad</option><option value="luz">Luz</option><option value="oscuridad">Oscuridad</option></select>
    <select id="mg"><option value="">Todos los grupos</option>${grupos.map(g => `<option value="${esc(g[0])}">${esc(g[1])}</option>`).join('')}</select></div>
    <div id="mapa"></div><p class="mut" id="mcount"></p>
    <div class="chips"><span class="chip luz">Luz</span><span class="chip osc">Oscuridad (más grande, mayor grado D)</span><span class="chip">Sin definir</span></div>`;
  const m = L.map('mapa').setView([7.5,-66], 5); mapaBase(m);
  const capa = L.featureGroup().addTo(m);
  const dibuja = () => {
    capa.clearLayers(); const fn = $('#mn').value, fg = $('#mg').value; let n = 0;
    pts.forEach(({u,s}) => {
      if((fn && s.naturaleza !== fn) || (fg && raizDe(s).id !== fg)) return;
      const osc = s.naturaleza === 'oscuridad', luz = s.naturaleza === 'luz';
      const col = osc ? '#ff6b6b' : luz ? '#d9b45a' : '#7fb0ff';
      const c = L.circleMarker([u.lat, u.lng], {radius: osc ? 6 + (s.grado_oscuridad || 3) : 8, color: col, fillColor: col, fillOpacity:.55, weight:2}).addTo(capa);
      c.bindPopup(`<b>${esc(s.codigo)}</b><br>${esc([u.ciudad,u.estado_region,u.pais].filter(Boolean).join(', '))}<br>${osc ? 'Oscuridad' + (s.grado_oscuridad ? ' D-' + s.grado_oscuridad : '') : luz ? 'Luz' : 'Sin definir'}<br>Grupo: ${esc(grupoNombre(raizDe(s)))}${s.linaje_alma ? '<br>' + esc(s.linaje_alma) : ''}<br><a href="https://www.google.com/maps?q=${u.lat},${u.lng}" target="_blank" rel="noopener" style="color:#d9b45a">Ver en Google Maps</a><br><button class="ghost" style="min-height:36px;margin-top:6px" data-id="${esc(s.id)}">Abrir ficha</button>`);
      c.on('popupopen', e => { const b = e.popup.getElement().querySelector('button'); if(b) b.onclick = () => { m.remove(); detalle(b.dataset.id); }; });
      n++;
    });
    $('#mcount').textContent = n ? n + ' punto(s) en el mapa.' : 'Aún no hay puntos. Abre una ficha, toca una ubicación y márcala en el mapa.';
    const b = capa.getBounds();
    b.isValid() ? m.fitBounds(b.pad(.3), {maxZoom:9}) : m.setView([7.5,-66], 5);
  };
  $('#mn').onchange = dibuja; $('#mg').onchange = dibuja;
  $('#atras').onclick = () => { m.remove(); lista(); };
  dibuja(); setTimeout(() => m.invalidateSize(), 100);
}

async function nombres(){
  const {data,error} = await sb.from('identidades').select('*');
  if(error) return alert('No se pudo cargar: ' + error.message);
  const filas = (data || []).map(i => ({i, s: seres.find(x => x.id === i.ser_id)})).filter(x => x.s)
    .sort((a,b) => a.s.codigo.localeCompare(b.s.codigo));
  const cuenta = n => filas.filter(f => f.s.naturaleza === n).length;
  $('#app').innerHTML = `<header><button class="ghost" id="atras">Volver</button><h2>Nombres reales</h2></header>
    <p class="mut">Solo visible para el administrador. ${filas.length} registro(s): ${cuenta('luz')} luz, ${cuenta('oscuridad')} oscuridad, ${cuenta('sin_definir')} sin definir.</p>
    <div class="tools"><input id="qn" type="search" placeholder="Buscar por nombre o código">
    <select id="nn" style="grid-column:1/-1;margin:0"><option value="">Luz, oscuridad y sin definir</option><option value="luz">Solo luz</option><option value="oscuridad">Solo oscuridad</option><option value="sin_definir">Sin definir</option></select></div>
    <div id="lnom"></div>`;
  const pintaN = () => {
    const q = $('#qn').value.toLowerCase(), fn = $('#nn').value;
    const f = filas.filter(x => (!fn || x.s.naturaleza === fn) && (x.s.codigo + ' ' + x.i.nombre_real).toLowerCase().includes(q));
    const fila = x => `<div class="card" data-id="${x.s.id}"><b>${esc(x.s.codigo)}</b> ${esc(x.i.nombre_real)} ${natChip(x.s.naturaleza, x.s.grado_oscuridad)}
      ${x.i.contacto ? `<div class="mut">${esc(x.i.contacto)}</div>` : ''}</div>`;
    const bloque = (n, t) => {
      const g = f.filter(x => x.s.naturaleza === n);
      if(n === 'oscuridad') g.sort((a,b) => (a.s.grado_oscuridad || 99) - (b.s.grado_oscuridad || 99));
      return g.length ? `<div class="sub">${t} (${g.length})</div>` + g.map(fila).join('') : '';
    };
    $('#lnom').innerHTML = bloque('luz','Luz') + bloque('oscuridad','Oscuridad') + bloque('sin_definir','Sin definir') || '<p class="mut">Sin resultados.</p>';
    document.querySelectorAll('#lnom .card').forEach(c => c.onclick = () => detalle(c.dataset.id));
  };
  $('#qn').oninput = pintaN; $('#nn').onchange = pintaN; $('#atras').onclick = lista; pintaN();
}

function pinta(){
  const q = filtro.q.toLowerCase(), filtrando = q || filtro.tipo || filtro.coro || filtro.nat || filtro.fg || filtro.vc || filtro.nv;
  const f = seres.filter(s =>
    [s.codigo,s.nombre_publico,s.raza_afin,s.linaje_alma,grupoNombre(raizDe(s))].join(' ').toLowerCase().includes(q) &&
    (!filtro.tipo || s.tipo === filtro.tipo) && (!filtro.coro || String(s.coro_id) === filtro.coro) && (!filtro.nat || s.naturaleza === filtro.nat) && (!filtro.fg || String(s.funcion_gaia_id) === filtro.fg) && (!filtro.vc || s.vinculado_a === filtro.vc) && (!filtro.nv || String(s.nivel_despertar_id) === filtro.nv));
  const grupos = new Map();
  f.forEach(s => { const r = raizDe(s); if(!grupos.has(r.id)) grupos.set(r.id, {r, m:[]}); grupos.get(r.id).m.push(s); });
  const tarjeta = s => `<div class="card" data-id="${s.id}"><b>${esc(s.codigo)}</b> ${esc(s.nombre_publico||'')}
    <div class="chips"><span class="chip">${s.tipo==='libro'?'Libros':'Persona real'}</span>
    ${s.coros_angelicos?`<span class="chip">${esc(s.coros_angelicos.nombre)}</span>`:''}
    ${s.nivel_graduacion?`<span class="chip">${esc(s.nivel_graduacion)}</span>`:''}${natChip(s.naturaleza, s.grado_oscuridad)}</div></div>`;
  $('#cards').innerHTML = [...grupos.values()].sort((a,b) => a.r.codigo.localeCompare(b.r.codigo)).map(({r,m}) => {
    const todos = seres.filter(x => raizDe(x).id === r.id);
    const nl = todos.filter(x => x.naturaleza === 'luz').length, no = todos.filter(x => x.naturaleza === 'oscuridad').length;
    return `<details class="grp" ${filtrando ? 'open' : ''}><summary><b>${esc(grupoNombre(r))}</b> ${natChip(r.naturaleza, r.grado_oscuridad)}
      <span class="mut">${todos.length} miembro(s), ${nl} luz, ${no} oscuridad</span></summary>
      ${m.sort((a,b) => a.id === r.id ? -1 : b.id === r.id ? 1 : a.codigo.localeCompare(b.codigo)).map(tarjeta).join('')}</details>`;
  }).join('') || '<p class="mut">No hay fichas todavía. Toca + para crear la primera.</p>';
  document.querySelectorAll('.card').forEach(c => c.onclick = () => detalle(c.dataset.id));
}

async function detalle(id){
  const s = seres.find(x => x.id === id);
  if(!s) return lista();
  const adm = rol === 'administrador';
  const [u,a,i,fm,up] = await Promise.all([
    sb.from('ubicaciones').select('*').eq('ser_id', id).order('es_actual',{ascending:false}),
    sb.from('afectaciones').select('*').eq('ser_id', id).order('fecha',{ascending:false}),
    adm ? sb.from('identidades').select('*').eq('ser_id', id).maybeSingle() : Promise.resolve({data:null}),
    sb.from('vinculos').select('*').eq('ser_origen', id).eq('rama','familia_sangre'),
    sb.from('vinculos').select('*').eq('ser_destino', id).eq('rama','familia_sangre')]);
  const ub = u.data || [], af = a.data || [], ident = i.data,
    fam = fm.data || [], arriba = (up.data || [])[0], origen = seres.find(x => x.id === s.origen_id),
    raiz = seres.find(x => x.id === s.raiz_id), derivados = seres.filter(x => x.raiz_id === id);
  const dato = (l,v) => v ? `<div class="item"><span class="mut">${l}</span><br>${esc(v)}</div>` : '';
  $('#app').innerHTML = `<header><button class="ghost" id="atras">Volver</button><button class="ghost" id="edit">Editar</button></header>
    <h2>${esc(s.codigo)} ${esc(s.nombre_publico||'')}</h2>
    <div class="chips"><span class="chip">${s.tipo==='libro'?'Libros':'Persona real'}</span>
      ${s.tipo_encarnacion?`<span class="chip">${s.tipo_encarnacion==='encarnado'?'Encarnado':'No encarnado'}</span>`:''}
      ${s.coros_angelicos?`<span class="chip">${esc(s.coros_angelicos.nombre)}</span>`:''}${natChip(s.naturaleza, s.grado_oscuridad)}</div>
    ${(origen||raiz)?`<div class="priv">${raiz?`<div class="link" id="raiz">Registro principal: <b>${esc(raiz.codigo)}</b></div>`:''}${origen?`<div class="link" id="orig">Proviene de: <b>${esc(origen.codigo)}</b>${arriba?', registrada como '+esc(relTxt(arriba)):''}</div>`:''}</div>`:''}
    ${adm && ident ? `<div class="priv"><b>Solo administrador</b><br>${esc(ident.nombre_real)}${ident.contacto?'<br>'+esc(ident.contacto):''}<br><span class="mut">Consentimiento: ${ident.consentimiento?'sí':'no'}</span></div>`:''}
    <div class="sec">${dato('Nivel de despertar', s.niveles_despertar && s.niveles_despertar.nombre)}${dato('Función en la ascensión de Gaia', s.funciones_gaia && s.funciones_gaia.nombre)}${dato('Vinculado a', s.vinculado_a)}${dato('Raza afín',s.raza_afin)}${dato('Nombre angelical',s.linaje_alma)}${dato('Grupo familiar', grupoNombre(raiz || s))}${dato('Nivel de ascensión',s.nivel_graduacion)}${dato('Notas',s.notas)}</div>
    <div class="sec"><h3>Linaje familiar</h3>${['paterno','materno','directo'].map(l => {
      const g = fam.filter(v => v.lado === l); if(!g.length) return '';
      return `<div class="sub">${LADOS.find(x => x[0] === l)[1]}</div>` + g.map(v => { const d = seres.find(x => x.id === v.ser_destino) || {};
        return `<div class="item link" data-id="${esc(d.id||'')}"><b>${esc(d.codigo||'')}</b> <span class="chip">${esc((REL.find(r => r[0] === v.relacion) || ['',''])[1])}</span>${natChip(d.naturaleza, d.grado_oscuridad)}${v.temporalidad==='pasado'?' <span class="mut">(fallecido)</span>':''}</div>`; }).join('');
    }).join('')}${fam.length?'':'<p class="mut">Sin familiares registrados.</p>'}
      <button class="ghost" id="adff">Agregar familiar</button></div>
    ${derivados.length?`<div class="sec"><h3>Registros derivados (${derivados.length})</h3>${derivados.map(d => { const og = seres.find(x => x.id === d.origen_id) || {};
      return `<div class="item link" data-id="${esc(d.id)}"><b>${esc(d.codigo)}</b> <span class="mut">proviene de ${esc(og.codigo||'')}</span> ${natChip(d.naturaleza, d.grado_oscuridad)}</div>`; }).join('')}</div>`:''}
    <div class="sec"><h3>Ubicaciones</h3>${ub.map(x=>`<div class="item link uloc" data-u="${esc(x.id)}">${esc([x.ciudad,x.estado_region,x.pais].filter(Boolean).join(', '))}
      <br><span class="mut">${esc(x.periodo||'')}${x.es_actual?' (actual)':''}${x.lat!=null?' (en el mapa, toca para cambiar)':' (toca para marcar en el mapa)'}</span></div>`).join('')||'<p class="mut">Sin ubicaciones.</p>'}
      <button class="ghost" id="addu">Agregar ubicación</button></div>
    <div class="sec"><h3>Afectaciones</h3>${af.map(x=>`<div class="item"><b>${x.categoria==='fisica'?'Física':'Espiritual'}</b>
      <span class="mut">${esc(x.fecha||'')} ${x.estado==='cesada'?'(cesada)':x.estado==='activa'?'(activa)':''}</span><br>${esc(x.descripcion)}
      ${x.fuente?`<br><span class="mut">Fuente: ${esc(x.fuente)}</span>`:''}</div>`).join('')||'<p class="mut">Sin afectaciones registradas.</p>'}
      <button class="ghost" id="adda">Agregar afectación</button></div>
    ${adm?'<div class="sec"><button class="ghost peligro" id="del">Eliminar esta ficha</button></div>':''}`;
  $('#atras').onclick = lista;
  document.querySelectorAll('.link[data-id]').forEach(e => e.onclick = () => detalle(e.dataset.id));
  if(origen) $('#orig').onclick = () => detalle(origen.id);
  if(raiz) $('#raiz').onclick = () => detalle(raiz.id);
  document.querySelectorAll('.uloc').forEach(e => e.onclick = () => elegirPunto(async pt => {
    if(!pt) return;
    const r = await sb.from('ubicaciones').update({lat:pt[0], lng:pt[1]}).eq('id', e.dataset.u);
    if(r.error) alert('No se pudo guardar: ' + r.error.message);
    detalle(id);
  }));
  if(adm) $('#del').onclick = async () => {
    const nd = seres.filter(x => x.raiz_id === id).length;
    if(!confirm('¿Eliminar la ficha ' + s.codigo + '? Se borrarán también sus ubicaciones, afectaciones, nombre real y vínculos.' + (nd ? ' Tiene ' + nd + ' registro(s) derivado(s) que quedarán sin registro principal.' : '') + ' No se puede deshacer.')) return;
    const r = await sb.from('seres').delete().eq('id', id);
    if(r.error) return alert('No se pudo eliminar: ' + r.error.message);
    await cargar(); lista();
  };
  $('#adff').onclick = () => hoja('Nuevo familiar de ' + s.codigo, [
    {k:'lado',l:'Linaje',t:'select',o:LADOS},
    {k:'relacion',l:'Relación con ' + s.codigo,t:'select',o:REL},
    {k:'naturaleza',l:'Naturaleza (luz u oscuridad)',t:'select',o:NAT},
    {k:'grado_oscuridad',l:'Grado de oscuridad (solo si es oscuridad)',t:'select',o:GRADOS},
    {k:'temporalidad',l:'Estado',t:'select',o:[['presente','Presente (vive)'],['pasado','Pasado (fallecido)']]},
    {k:'notas',l:'Notas del vínculo',t:'area'}],
    {lado:'paterno',relacion:'padre',naturaleza:'sin_definir',temporalidad:'presente'},
    async o => {
      const r = await sb.from('seres').insert({codigo:siguienteCodigo(), tipo:'persona_real', naturaleza:o.naturaleza, grado_oscuridad:(o.naturaleza === 'oscuridad' && o.grado_oscuridad) ? Number(o.grado_oscuridad) : null, origen_id:id, raiz_id:s.raiz_id || id}).select().single();
      if(r.error) return r.error;
      const r2 = await sb.from('vinculos').insert({ser_origen:id, ser_destino:r.data.id, rama:'familia_sangre', lado:o.lado, relacion:o.relacion, temporalidad:o.temporalidad, notas:o.notas});
      if(r2.error) return r2.error;
      await cargar(); detalle(r.data.id);
    });
  $('#edit').onclick = () => fichaForm(s, ident);
  $('#addu').onclick = () => elegirPunto(async pt => hoja('Nueva ubicación', [
    {k:'pais',l:'País'},{k:'estado_region',l:'Estado o región'},{k:'ciudad',l:'Ciudad (opcional)'},
    {k:'periodo',l:'Periodo (ej. encarnación actual)'},{k:'es_actual',l:'Es la ubicación actual',t:'check'},{k:'notas',l:'Notas',t:'area'}],
    {es_actual:true, ...(pt ? await lugarDe(pt[0], pt[1]) : {})}, async o => { if(!o.pais) return {message:'Falta el país.'};
      const r = await sb.from('ubicaciones').insert({...o, ser_id:id, lat:pt ? pt[0] : null, lng:pt ? pt[1] : null}); if(!r.error) detalle(id); return r.error; }));
  $('#adda').onclick = () => hoja('Nueva afectación', [
    {k:'categoria',l:'Tipo',t:'select',o:[['espiritual','Espiritual'],['fisica','Física']]},
    {k:'descripcion',l:'Descripción (como la reporta la persona)',t:'area'},{k:'fecha',l:'Fecha',t:'date'},
    {k:'fuente',l:'Fuente (ej. reportada por la persona)'},
    {k:'estado',l:'Estado',t:'select',o:[['activa','Activa'],['cesada','Cesada']]}],
    {categoria:'espiritual',fuente:'Reportada por la persona',estado:'activa'},
    async o => { if(!o.descripcion) return {message:'Falta la descripción.'};
      const r = await sb.from('afectaciones').insert({...o, ser_id:id}); if(!r.error) detalle(id); return r.error; });
}

function fichaForm(s, ident){
  const nuevo = !s, adm = rol === 'administrador';
  const v = {codigo:siguienteCodigo(), tipo:'persona_real', ...(s||{}),
    ...(ident ? {nombre_real:ident.nombre_real, contacto:ident.contacto, consentimiento:ident.consentimiento} : {})};
  const campos = [
    {k:'codigo',l:'Código'},
    {k:'tipo',l:'Tipo',t:'select',o:TIPOS},
    {k:'nombre_publico',l:'Nombre (solo seres de los libros)'},
    {k:'tipo_encarnacion',l:'Encarnación',t:'select',o:ENC},
    {k:'coro_id',l:'Coro angélico',t:'select',o:[['','Sin definir'],...coros.map(c=>[c.id,c.nombre])]},
    {k:'nivel_despertar_id',l:'Niveles de despertar',t:'select',o:[['','Sin definir'],...niveles.map(n=>[n.id,n.nombre])]},
    {k:'funcion_gaia_id',l:'Funciones en la ascensión de Gaia',t:'select',o:[['','Sin definir'],...funciones.map(f=>[f.id,f.nombre])]},
    {k:'vinculado_a',l:'Vinculado a',t:'select',o:[['','Sin definir'],...VINC.map(v=>[v,v])]},
    {k:'raza_afin',l:'Raza estelar afín'},
    {k:'linaje_alma',l:'Nombre angelical'},
    {k:'nivel_graduacion',l:'Nivel de ascensión'},
    {k:'naturaleza',l:'Naturaleza (luz u oscuridad)',t:'select',o:NAT},
    {k:'grado_oscuridad',l:'Grado de oscuridad (solo si es oscuridad)',t:'select',o:GRADOS},
    {k:'notas',l:'Notas',t:'area'},
    ...((!s || !s.raiz_id) ? [{k:'grupo',l:'Nombre del grupo familiar (opcional)'}] : []),
    ...(adm ? [{k:'nombre_real',l:'Solo administrador: nombre real'},{k:'contacto',l:'Solo administrador: contacto'},
               {k:'consentimiento',l:'La persona dio su consentimiento',t:'check'}] : [])];
  hoja(nuevo ? 'Nueva ficha' : 'Editar ficha', campos, v, async o => {
    const id_ = {nombre_real:o.nombre_real, contacto:o.contacto, consentimiento:!!o.consentimiento};
    delete o.nombre_real; delete o.contacto; delete o.consentimiento;
    o.coro_id = o.coro_id ? Number(o.coro_id) : null;
    o.funcion_gaia_id = o.funcion_gaia_id ? Number(o.funcion_gaia_id) : null;
    o.nivel_despertar_id = o.nivel_despertar_id ? Number(o.nivel_despertar_id) : null;
    if(o.tipo === 'persona_real') o.nombre_publico = null;
    o.grado_oscuridad = (o.naturaleza === 'oscuridad' && o.grado_oscuridad) ? Number(o.grado_oscuridad) : null;
    const r = nuevo ? await sb.from('seres').insert(o).select().single()
                    : await sb.from('seres').update(o).eq('id', s.id).select().single();
    if(r.error) return r.error;
    if(adm && o.tipo === 'persona_real' && id_.nombre_real){
      const hoy = new Date().toISOString().slice(0,10);
      const r2 = await sb.from('identidades').upsert({ser_id:r.data.id, ...id_,
        fecha_consentimiento: id_.consentimiento ? ((ident && ident.fecha_consentimiento) || hoy) : null});
      if(r2.error) return r2.error;
    }
    await cargar(); detalle(r.data.id);
  });
}

// Hoja inferior genérica para formularios
function hoja(titulo, campos, valores, guardar){
  const h = $('#sheet'); h.hidden = false;
  h.innerHTML = `<div class="hoja"><h3>${esc(titulo)}</h3><form id="fm">${campos.map(c => {
    const v = valores[c.k] ?? ''; let el;
    if(c.t === 'select') el = `<select name="${c.k}">${c.o.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
    else if(c.t === 'area') el = `<textarea name="${c.k}" rows="3">${esc(v)}</textarea>`;
    else if(c.t === 'check') el = `<input type="checkbox" name="${c.k}" ${v?'checked':''}>`;
    else el = `<input name="${c.k}" type="${c.t||'text'}" value="${esc(v)}">`;
    return `<label>${esc(c.l)}${el}</label>`; }).join('')}
    <div class="row"><button type="button" class="ghost" id="cx">Cancelar</button><button class="btn">Guardar</button></div></form></div>`;
  $('#cx').onclick = cerrar;
  $('#fm').onsubmit = async e => {
    e.preventDefault(); const o = {};
    campos.forEach(c => { const el = e.target.elements[c.k];
      o[c.k] = c.t === 'check' ? el.checked : (el.value.trim() === '' ? null : el.value.trim()); });
    const err = await guardar(o);
    err ? alert('No se pudo guardar: ' + err.message) : cerrar();
  };
}
function cerrar(){ const h = $('#sheet'); h.hidden = true; h.innerHTML = ''; }

init();
</script>
